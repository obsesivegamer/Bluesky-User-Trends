name: Collect Bluesky Social Data

on:
  schedule:
    # 03:00 UTC collects yesterday in full: Jetstream replays about 36 hours, so at 03:00 the start of
    # yesterday is ~27 hours back, with ~9 hours of slack (the collector keeps a 2 hour safety margin of
    # that). The 09:00 UTC run is a free retry: the collector only fills time the day file does not
    # cover yet, so when 03:00 finished it does nothing and the builder just refreshes the boards.
    - cron: '0 3,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Its own group, not update-data: GitHub keeps one pending run per group, so sharing it would let the
  # 03:17 data update replace a 03:00 collection queued behind a long 02:37 count. This workflow commits
  # only data/social.js, which the other workflows never touch, so concurrent pushes rebase cleanly.
  group: collect-social
  cancel-in-progress: false

jobs:
  collect-social:
    runs-on: ubuntu-latest
    # Longer than the step budgets together (collect 60 + build 25) plus checkout, setup, cache restore
    # and save, npm test and the push, so a slow run is never cancelled in the middle of the commit.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      # The cache below is encrypted with this repository secret. A fork has no secrets, so it fails here,
      # before anything is collected or saved.
      - name: Require the STATE_KEY secret
        id: key
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::The STATE_KEY repository secret is empty or missing (forks do not receive secrets). Add a random key under Settings > Secrets and variables > Actions, for example the output of: openssl rand -base64 48"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # PRIVACY: the day files, the pool and the follower history name small accounts by DID, and the
      # page only names accounts with 10K+ followers. They live in .state/ (git-ignored) and travel
      # between runs in the Actions cache, never in this public repo. A cache is NOT private by itself:
      # a pull request from a fork can restore the caches of the base repository and print them. So the
      # cache holds only .state-cache/state.tar.enc, a tar of .state encrypted with the STATE_KEY secret
      # (forks do not receive secrets). Only data/social.js (guardrail-filtered and validated) is
      # committed. GitHub evicts a cache not used for 7 days (a daily run keeps it warm); losing it only
      # shortens the 7d / movers history. The key prefix is new, so old plaintext caches are never restored.
      - name: Restore the encrypted social state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-cache
          key: social-state-enc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: social-state-enc-

      # A state that cannot be decrypted (key rotated, corrupt entry) is not fatal: the run starts from an
      # empty state, collects yesterday again, and the builder republishes from that one day (it keeps the
      # published data/social.js only when there are no day files at all).
      - name: Decrypt the social state
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ ! -f .state-cache/state.tar.enc ]; then
            echo "No cached state; starting empty."
            exit 0
          fi
          tar_file="$RUNNER_TEMP/state.tar"
          if openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 -pass env:STATE_KEY -in .state-cache/state.tar.enc -out "$tar_file" && tar -xf "$tar_file"; then
            echo "Restored the social state."
          else
            echo "::warning::Could not decrypt or unpack the cached social state (wrong STATE_KEY or a corrupt entry); starting with an empty state."
            rm -rf .state
          fi
          rm -f "$tar_file"

      # A failed collection still keeps whatever earlier pieces of the day were written (each piece is
      # saved when it finishes), so the job goes on to build, save the state and commit, then fails at the end.
      - name: Replay Jetstream into the day file
        id: collect
        continue-on-error: true
        timeout-minutes: 60
        run: node scripts/collect-social.js

      # Exits non-zero and writes nothing if an essential AppView call keeps failing or validation
      # fails, so a failed build leaves the previous data/social.js in place.
      - name: Build the leaderboards
        id: build
        continue-on-error: true
        timeout-minutes: 25
        run: node scripts/build-social.js

      # Encrypted right after the build, before the tests and the push can fail, so the collected pieces
      # survive a red run. Only the encrypted file is in the cache path: the plaintext tar is built in
      # RUNNER_TEMP and removed, and .state itself is never under .state-cache.
      - name: Encrypt the social state
        id: encrypt
        if: ${{ !cancelled() && steps.key.outcome == 'success' }}
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          rm -rf .state-cache
          mkdir .state-cache
          if [ ! -d .state ]; then
            echo "::warning::No .state to save."
            exit 0
          fi
          tar_file="$RUNNER_TEMP/state.tar"
          tar -cf "$tar_file" .state
          if ! openssl enc -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 -salt -pass env:STATE_KEY -in "$tar_file" -out .state-cache/state.tar.enc; then
            rm -f "$tar_file" .state-cache/state.tar.enc
            exit 1
          fi
          rm -f "$tar_file"

      # A cache entry is immutable, hence a new key per run attempt (a re-run keeps its run_id); the newest
      # one is restored by prefix. Skipped when encryption failed or wrote nothing, so an empty directory
      # is never cached over the last good entry.
      - name: Save the encrypted social state
        if: ${{ !cancelled() && steps.encrypt.outcome == 'success' && hashFiles('.state-cache/state.tar.enc') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state-cache
          key: social-state-enc-${{ github.run_id }}-${{ github.run_attempt }}

      # After the build, so the gate checks the code and the data about to be committed.
      - name: Run tests
        id: tests
        run: npm test

      # Commits only data/social.js (the raw state stays in the encrypted cache). The push is skipped when the
      # tests fail or the run is cancelled: never publish data the gate rejects.
      - name: Commit and push if anything changed
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: social data update (automated)"
          for attempt in 1 2; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            if [ "$attempt" -eq 1 ]; then sleep 15; fi
          done
          echo "::error::Could not push the social data update after 2 attempts."
          exit 1

      # Runs after the commit and the cache save so partial progress is kept, and turns the run red.
      - name: Fail if collection or build failed
        if: ${{ !cancelled() && (steps.collect.outcome == 'failure' || steps.build.outcome == 'failure') }}
        env:
          COLLECT: ${{ steps.collect.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "::error::Social data run incomplete: collect=$COLLECT build=$BUILD. Partial state was saved to the cache; the next scheduled run fills what is missing."
          exit 1
