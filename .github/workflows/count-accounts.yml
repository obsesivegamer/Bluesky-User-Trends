name: Count Bluesky Accounts

on:
  schedule:
    # Before the 03:17 data update, which publishes this count on the page.
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with update-data.yml so the two never race on a push.
  group: update-data
  cancel-in-progress: false

jobs:
  count-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Count accounts on every Bluesky-operated PDS host
        run: node scripts/count-accounts.js

      # Runs even when a host failed: the row is saved as incomplete (kept out of net growth), and
      # the failed count step still marks the run red so the failure is visible.
      - name: Commit and push the count
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/accounts-daily.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: account count (automated)"
          for attempt in 1 2; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed."
            if [ "$attempt" -eq 1 ]; then sleep 15; fi
          done
          echo "::error::Could not push the account count after 2 attempts."
          exit 1
